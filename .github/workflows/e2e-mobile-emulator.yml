name: E2E Mobile Emulator

on:
  workflow_dispatch:

jobs:
  e2e-mobile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish web app
        run: dotnet publish src/TodoExtended.Web/TodoExtended.Web.csproj --configuration Release -o /tmp/todoextended-publish

      - name: Build E2E tests
        run: dotnet build tests/TodoExtended.E2E/TodoExtended.E2E.csproj --configuration Debug

      - name: Install Playwright browsers
        run: pwsh tests/TodoExtended.E2E/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Start app in demo mode
        run: |
          cd /tmp/todoextended-publish && dotnet TodoExtended.Web.dll &
          started=false
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/; then
              started=true
              break
            fi
            sleep 2
          done
          if [ "$started" != "true" ]; then
            echo "App failed to start within timeout." >&2
            exit 1
          fi
        env:
          Demo__Enabled: "true"
          ASPNETCORE_URLS: "http://localhost:5000"
          ConnectionStrings__DefaultConnection: "Data Source=/tmp/e2e-todoextended.db"

      - name: Create Android emulator script
        run: |
          cat > /tmp/e2e-android-script.sh << 'SCRIPT'
          # Mark Chrome as a debug app so it reads the command-line flags file.
          # Release Chrome builds on google_apis images ignore the flags file unless
          # the app is explicitly set as debuggable via am set-debug-app.
          adb shell am set-debug-app --persistent com.android.chrome
          # Kill any running Chrome instance so it starts fresh with the new flags.
          adb shell am force-stop com.android.chrome
          # Write Chrome command-line flags to enable CDP remote debugging.
          # The leading underscore is a placeholder for the program name — Chrome
          # ignores the first token and reads the remainder as command-line flags.
          # --no-first-run and --disable-fre skip the first-run onboarding screen.
          adb shell "echo '_ --remote-debugging-port=9222 --no-first-run --disable-fre' > /data/local/tmp/chrome-command-line"
          adb shell chmod 644 /data/local/tmp/chrome-command-line
          # Launch Chrome to a blank page so the debugging session is initialised
          adb shell am start -a android.intent.action.VIEW -d "about:blank" com.android.chrome
          # Give Chrome a moment to start before setting up the forward
          sleep 10
          # Forward Chrome's DevTools Protocol Unix socket to a host TCP port
          adb forward tcp:9222 localabstract:chrome_devtools_remote
          # Poll the CDP endpoint until it responds (up to 120 s)
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9222/json/version > /dev/null 2>&1; then
              echo "CDP endpoint ready."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "CDP endpoint not reachable after timeout." >&2
              exit 1
            fi
            sleep 2
          done
          export E2E_BASE_URL="http://10.0.2.2:5000"
          export E2E_USE_ANDROID_EMULATOR="true"
          export E2E_ANDROID_CDP_ENDPOINT="http://localhost:9222"
          dotnet test tests/TodoExtended.E2E/TodoExtended.E2E.csproj --configuration Debug --no-build
          SCRIPT
          chmod +x /tmp/e2e-android-script.sh

      - name: Run E2E tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          avd-name: e2e_avd
          script: bash /tmp/e2e-android-script.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-mobile-screenshots
          path: |
            tests/TodoExtended.E2E/screenshots/
            docs/screenshots/
          if-no-files-found: warn
