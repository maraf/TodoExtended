name: Web CD

on:
  push:
    tags:
      - 'web-*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#web-}" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_GHCR_LOGIN_TOKEN }}

      - name: Publish container image
        run: >
          dotnet publish src/TodoExtended.Web/TodoExtended.Web.csproj
          -c Release
          --os linux
          --arch x64
          /t:PublishContainer
          /p:VersionPrefix=${{ steps.version.outputs.version }}
