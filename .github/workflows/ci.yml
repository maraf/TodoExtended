name: CI

on:
  pull_request:
  schedule:
    - cron: '30 4 * * *'  # Daily at 4:30 UTC
  workflow_dispatch:

jobs:
  changes:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for recent commits
        id: check
        run: |
          if git log --oneline --since="25 hours ago" | head -1 | grep -q .; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [changes]
    if: always() && (github.event_name != 'schedule' || needs.changes.outputs.has_changes == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build TodoExtended.Web
        run: dotnet build src/TodoExtended.Web/TodoExtended.Web.csproj --configuration Release

  component-tests:
    needs: [changes]
    if: always() && (github.event_name != 'schedule' || needs.changes.outputs.has_changes == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run component tests
        run: dotnet test tests/TodoExtended.Components.Tests/TodoExtended.Components.Tests.csproj --configuration Release

  e2e:
    needs: [changes]
    if: always() && (github.event_name != 'schedule' || needs.changes.outputs.has_changes == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish web app
        run: dotnet publish src/TodoExtended.Web/TodoExtended.Web.csproj --configuration Release -o /tmp/todoextended-publish

      - name: Build E2E tests
        run: dotnet build tests/TodoExtended.E2E/TodoExtended.E2E.csproj --configuration Debug

      - name: Install Playwright browsers
        run: pwsh tests/TodoExtended.E2E/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Start app in demo mode
        run: |
          cd /tmp/todoextended-publish && dotnet TodoExtended.Web.dll &
          # Wait until the app responds
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/ && break || sleep 2
          done
        env:
          Demo__Enabled: "true"
          ASPNETCORE_URLS: "http://localhost:5000"
          ConnectionStrings__DefaultConnection: "Data Source=/tmp/e2e-todoextended.db"

      - name: Run E2E tests
        run: dotnet test tests/TodoExtended.E2E/TodoExtended.E2E.csproj --configuration Debug --no-build
        env:
          E2E_BASE_URL: "http://localhost:5000"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: docs/screenshots/
          if-no-files-found: warn
