name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build TodoExtended.Web
        run: dotnet build src/TodoExtended.Web/TodoExtended.Web.csproj --configuration Release

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish web app
        run: dotnet publish src/TodoExtended.Web/TodoExtended.Web.csproj --configuration Release -o /tmp/todoextended-publish

      - name: Build E2E tests
        run: dotnet build tests/TodoExtended.E2E/TodoExtended.E2E.csproj --configuration Debug

      - name: Install Playwright browsers
        run: pwsh tests/TodoExtended.E2E/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Start app in demo mode
        run: |
          cd /tmp/todoextended-publish && dotnet TodoExtended.Web.dll &
          # Wait until the app responds
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/ && break || sleep 2
          done
        env:
          Demo__Enabled: "true"
          ASPNETCORE_URLS: "http://localhost:5000"
          ConnectionStrings__DefaultConnection: "Data Source=/tmp/e2e-todoextended.db"

      - name: Run E2E tests
        run: dotnet test tests/TodoExtended.E2E/TodoExtended.E2E.csproj --configuration Debug --no-build
        env:
          E2E_BASE_URL: "http://localhost:5000"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/TodoExtended.E2E/screenshots/
          if-no-files-found: warn

      - name: Post screenshot to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const screenshotPath = 'tests/TodoExtended.E2E/screenshots/home-authenticated.png';

            if (!fs.existsSync(screenshotPath)) {
              console.log('No screenshot found, skipping PR comment');
              return;
            }

            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactLink = `[Download all screenshots](${runUrl})`;

            // Upload image to GitHub's asset hosting for issues
            const imageData = fs.readFileSync(screenshotPath);
            const uploadResponse = await fetch(
              `https://uploads.github.com/repos/${context.repo.owner}/${context.repo.repo}/issues/${context.issue.number}/assets?name=home-authenticated.png`,
              {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
                  'Content-Type': 'image/png',
                },
                body: imageData,
              }
            );

            let body;
            if (uploadResponse.ok) {
              const uploadResult = await uploadResponse.json();
              const imageUrl = uploadResult.href || uploadResult.url;
              body = `## 📸 E2E Screenshot\n\n![Home page after demo sign-in](${imageUrl})\n\n${artifactLink}`;
            } else {
              console.log(`Image upload failed (${uploadResponse.status}), linking to run instead`);
              body = `## 📸 E2E Screenshots\n\nScreenshots captured. ${artifactLink}`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

